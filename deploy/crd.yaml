apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.chaosreplay.io
spec:
  group: chaosreplay.io
  scope: Namespaced
  names:
    plural: chaosexperiments
    singular: chaosexperiment
    kind: ChaosExperiment
    shortNames: [cex]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [apiVersion, id, target, steps]
              properties:
                apiVersion: {type: string, enum: [chaosreplay/v1]}
                id: {type: string, minLength: 1}
                seed: {type: integer, format: int64}
                target:
                  type: object
                  required: [kind, name, namespace, selector]
                  properties:
                    kind: {type: string}
                    name: {type: string}
                    namespace: {type: string}
                    selector:
                      type: object
                      additionalProperties: {type: string}
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, fault]
                    properties:
                      id: {type: string, minLength: 1}
                      afterMs: {type: integer, format: int64, minimum: 0}
                      durationMs: {type: integer, format: int64, minimum: 0}
                      fault:
                        type: object
                        required: [type]
                        properties:
                          type: {type: string, enum: [network_latency, packet_loss, process_kill, disk_io_limit]}
                          params:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                assertions:
                  type: array
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name: {type: string}
                      type: {type: string, enum: [http, prometheus]}
                      url: {type: string}
                      query: {type: string}
                      expectCode: {type: integer}
                      expression: {type: string}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Running, Succeeded, Failed]}
                message: {type: string}
                updatedAt: {type: string, format: date-time}
                planHash: {type: string}
                scenarioHash: {type: string}
                targetCount: {type: integer}
                recordName: {type: string}
                assertion: {type: object, x-kubernetes-preserve-unknown-fields: true}
      subresources:
        status: {}
