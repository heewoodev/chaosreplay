apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pdb.yaml
patches:
  - path: agent-tls.patch.yaml
  - path: controller-tls.patch.yaml
images:
  - name: chaosreplay/agent
    newName: registry.example.com/platform/chaosreplay-agent
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
  - name: chaosreplay/controller
    newName: registry.example.com/platform/chaosreplay-controller
    digest: sha256:REPLACE_WITH_SIGNED_DIGEST
