apiVersion: v1
kind: Namespace
metadata:
  name: chaosreplay-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: chaosreplay-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: chaosreplay-test
spec:
  selector: {app: checkout}
  ports: [{port: 80, targetPort: 80}]
